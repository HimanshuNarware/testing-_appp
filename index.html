<!doctype html>
<html lang="en">

<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Title -->
  <title>SafeCity - Women Safety Heatmap & Crime Awareness Platform</title>

  <!-- SEO Meta -->
  <meta name="description"
    content="SafeCity is a real-time women safety platform that helps users explore city safety using crime data, heatmaps, and risk analysis. Find safe and unsafe areas before you travel." />
  <meta name="keywords"
    content="women safety app, crime heatmap, safe areas, unsafe areas, city safety, NCRB data, safety tracker, travel safety for women" />
  <meta name="author" content="SafeCity Team" />

  <!-- Open Graph (for social sharing) -->
  <meta property="og:title" content="SafeCity - Real-Time Women Safety Platform" />
  <meta property="og:description"
    content="Explore city safety using real-time crime data and heatmaps. Identify safe and unsafe areas for women." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://yourdomain.com" />
  <meta property="og:image" content="https://yourdomain.com/preview.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SafeCity - Women Safety Heatmap" />
  <meta name="twitter:description" content="Track safe and unsafe areas using crime data visualization." />
  <meta name="twitter:image" content="https://yourdomain.com/preview.png" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="any" id="default-favicon" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>
    // Dynamically crop favicons into circles
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll('link[rel="icon"][type="image/png"], link[rel="apple-touch-icon"]').forEach(link => {
        const img = new Image();
        img.src = link.href;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          
          // Draw circular mask
          ctx.beginPath();
          ctx.arc(img.width / 2, img.height / 2, Math.min(img.width, img.height) / 2, 0, Math.PI * 2);
          ctx.clip();
          ctx.drawImage(img, 0, 0);
          
          // Replace link href with new circular image data
          link.href = canvas.toDataURL('image/png');
        };
      });
    });
  </script>

  <!-- Theme Color -->
  <meta name="theme-color" content="#ff4d6d" />

  <!-- Robots -->
  <meta name="robots" content="index, follow" />

  <!-- Canonical -->
  <link rel="canonical" href="https://yourdomain.com" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
